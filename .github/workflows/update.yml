name: Update prices and deploy

on:
  schedule:
    - cron: "7 15 * * *"    # daily, ~1:07am AEST (GitHub often starts it hours late)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["web/**", "scraper/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scrape catalogue
        if: github.event_name != 'push'
        run: python scraper/scrape.py

      - name: Commit new price data
        if: github.event_name != 'push'
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Price data $(TZ=Australia/Brisbane date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Build site
        run: python scraper/build.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job so the uploaded artifact has time to become visible, and so
  # "Re-run failed jobs" retries only the deploy, not the scrape.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      # deploy-pages sometimes can't see the artifact yet ("No artifacts named
      # github-pages were found"); wait and try once more.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
